name: Build Desktop and Mobile Apps
on:
  push:
    branches:
      - main  # Fires automatically whenever you push code changes to the main branch

permissions:
  contents: write  # Grants the workflow worker explicit rights to save binaries back to your repo

jobs:
  # --- JOB 1: BUILD WINDOWS EXE ON A WINDOWS RUNNER ---
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Fetch Current Workspace Files
        uses: actions/checkout@v4

      - name: Configure Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Windows Desktop App File (.exe)
        run: |
          npm install -g pake-cli
          pake https://ivanclarklim2006-sudo.github.io/CC316-PROJECT/ --name "Roll_and_Register" --targets win
          mkdir downloads
          move *.exe downloads\Roll_and_Register_Setup.exe
        shell: cmd

      - name: Upload Windows Artifact temporarily
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: downloads/Roll_and_Register_Setup.exe

  # --- JOB 2: BUILD ANDROID APK ON A LINUX RUNNER ---
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Current Workspace Files
        uses: actions/checkout@v4

      - name: Configure Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Java Mobile Dependencies
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Mobile App File (.apk)
        run: |
          npm install -g @bubblewrap/cli
          
          # Automatically satisfies both the JDK and Android SDK setup prompts headlessly
          yes "Y" | bubblewrap init --manifest="https://github.io" --meta --yes --accept-notice
          
          # Automatically hits enter through the final build confirmation prompts
          yes "" | bubblewrap build --yes
          
          mkdir -p downloads
          mv *.apk downloads/app-release-signed.apk || true

      - name: Upload Android Artifact temporarily
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: downloads/app-release-signed.apk

  # --- JOB 3: COMBINE FILES AND PUSH TO GITHUB PAGES ---
  deploy-apps:
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    steps:
      - name: Fetch Current Workspace Files
        uses: actions/checkout@v4

      - name: Download Windows Executable
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: downloads/

      - name: Download Android Package
        uses: actions/download-artifact@v4
        with:
          name: android-app
          path: downloads/

      - name: Commit and Push Installer Packages to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add downloads/
          git commit -m "System Build: Automatically updated release installers" || exit 0
          git push origin main
